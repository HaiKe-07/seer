<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>精灵抓取 · 内置浏览器</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      background: #0b1220; color: #dfe7f5; height: 100vh; display: flex; flex-direction: column;
    }
    .toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: #0f1a2f; border-bottom: 1px solid #1f3050; }
    .toolbar button { background: #17253f; color: #dfe7f5; border: 1px solid #1f3050; padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; }
    .toolbar button:hover { border-color: #2b7bff; }
    .toolbar button.primary { background: linear-gradient(135deg, #2b7bff, #00c2ff); border: none; font-weight: 600; }
    .toolbar button:disabled { opacity: .5; cursor: not-allowed; }
    .address { flex: 1; }
    .address input { width: 100%; background: #0b1220; border: 1px solid #1f3050; color: #dfe7f5; padding: 7px 10px; border-radius: 8px; font-size: 13px; }
    .address input:focus { outline: none; border-color: #2b7bff; }
    .status { padding: 5px 10px; font-size: 12px; color: #8fa3c6; min-height: 18px; }
    .status.ok { color: #19d3a6; }
    .status.warn { color: #ffb020; }
    .status.error { color: #ff5a6e; }
    .resultbar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: #0f1a2f; border-top: 1px solid #1f3050; font-size: 12px; }
    .resultbar .count { color: #00c2ff; font-weight: 700; }
    webview { flex: 1; background: #fff; }
  </style>
</head>
<body>
  <div class="toolbar">
    <button id="back">←</button>
    <button id="fwd">→</button>
    <button id="reload">⟳</button>
    <div class="address"><input id="url" placeholder="输入赛尔号页面地址，回车跳转（可登录后浏览）" /></div>
    <button id="go">前往</button>
    <button id="grab" class="primary">抓取当前页精灵</button>
    <button id="grabText">抓正文素材</button>
    <button id="done">完成并导入</button>
  </div>

  <div id="status" class="status">提示：内置浏览器仅供你浏览/登录页面。点「抓取当前页精灵」采集当前页精灵候选，「抓正文素材」抽取正文用于攻略，「完成并导入」写入精灵池。</div>

  <webview id="wv" allowpopups></webview>

  <textarea id="textOut" hidden style="width:100%;flex:1;background:#0b1220;color:#dfe7f5;border:1px solid #1f3050;padding:10px;font-size:12px;resize:none" placeholder="已抓取的正文素材会显示在这里，可全选复制，再到【PvE 攻略】页手动导入原始文本供 AI 清洗。"></textarea>

  <div class="resultbar">
    <span>已抓取候选：<span id="count" class="count">0</span> 项</span>
    <span id="chips" style="display:flex;flex-wrap:wrap;gap:4px"></span>
  </div>

  <script>
    const wv = document.getElementById('wv');
    const urlInput = document.getElementById('url');
    const statusEl = document.getElementById('status');
    const countEl = document.getElementById('count');
    const chipsEl = document.getElementById('chips');
    const textOut = document.getElementById('textOut');
    let grabbed = [];
    let currentAdapter = '';

    function setStatus(msg, kind = '') {
      statusEl.textContent = msg;
      statusEl.className = 'status ' + kind;
    }
    function renderChips() {
      countEl.textContent = grabbed.length;
      chipsEl.innerHTML = '';
      grabbed.slice(0, 60).forEach((g) => {
        const s = document.createElement('span');
        s.textContent = g.name;
        s.style.cssText = 'padding:2px 8px;border-radius:6px;background:#17253f;border:1px solid #1f3050;font-size:11px;';
        chipsEl.appendChild(s);
      });
      if (grabbed.length > 60) {
        const s = document.createElement('span');
        s.textContent = `…共${grabbed.length}项`;
        s.style.cssText = 'color:#8fa3c6;font-size:11px;';
        chipsEl.appendChild(s);
      }
    }

    document.getElementById('back').onclick = () => wv.canGoBack() && wv.goBack();
    document.getElementById('fwd').onclick = () => wv.canGoForward() && wv.goForward();
    document.getElementById('reload').onclick = () => wv.reload();
    document.getElementById('go').onclick = go;
    urlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
    function go() {
      let u = urlInput.value.trim();
      if (!u) return;
      if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
      setStatus('正在加载 ' + u);
      wv.src = u;
    }

    // 同步地址栏与页面标题
    wv.addEventListener('did-navigate', (e) => { urlInput.value = e.url; setStatus('当前页：' + e.url); });
    wv.addEventListener('page-title-updated', (e) => { document.title = (e.title || '精灵抓取') + ' · 内置浏览器'; });

    // 抓取当前页
    document.getElementById('grab').onclick = async () => {
      setStatus('正在抓取当前页精灵…');
      const btn = document.getElementById('grab');
      btn.disabled = true;
      try {
        const pageUrl = wv.getURL && wv.getURL();
        // 按当前页面 URL 获取最贴合的提取脚本（适配器）+ 命中信息
        const got = await window.syncAPI.getScript(pageUrl || '');
        const script = (got && got.script) || (window.SEER_EXTRACT_SCRIPT || '0');
        currentAdapter = got && got.adapterName;
        const result = await wv.executeJavaScript(script, true);
        let data = result;
        if (typeof result === 'string') { try { data = JSON.parse(result); } catch (_) { data = null; } }
        const items = (data && data.items) ? data.items : (Array.isArray(data) ? data : []);
        if (!items.length) { setStatus('当前页未识别到精灵候选，请滚动/翻页后再试（需含「·」命名或精灵卡片图）。', 'warn'); return; }
        grabbed = items;
        renderChips();
        const tag = currentAdapter ? ` [${currentAdapter}]` : '';
        setStatus(`已抓取 ${items.length} 项精灵候选${tag}，点「完成并导入」写入精灵池。`, 'ok');
      } catch (err) {
        setStatus('抓取失败：' + (err && err.message || err), 'error');
      } finally {
        btn.disabled = false;
      }
    };

    // 抓取当前页正文（攻略素材）：展示在 textarea，供复制到 PvE 手动导入
    document.getElementById('grabText').onclick = async () => {
      setStatus('正在抽取当前页正文…');
      const btn = document.getElementById('grabText');
      btn.disabled = true;
      try {
        const got = await window.syncAPI.getTextScript();
        const res = await wv.executeJavaScript(got.script, true);
        const data = typeof res === 'string' ? JSON.parse(res) : res;
        if (!data || !data.text || !data.text.trim()) {
          setStatus('当前页未抽取到有效正文，请打开具体帖子/文章页后再试。', 'warn');
          return;
        }
        textOut.hidden = false;
        textOut.value = `【${data.title}】\n${data.url}\n\n${data.text}`;
        textOut.select();
        setStatus(`已抽取正文 ${data.text.length} 字。可 Ctrl+C 复制，再到【PvE 攻略】粘贴导入。`, 'ok');
      } catch (err) {
        setStatus('抽取失败：' + (err && err.message || err), 'error');
      } finally {
        btn.disabled = false;
      }
    };

    // 完成并导入
    document.getElementById('done').onclick = async () => {
      if (!grabbed.length) { setStatus('暂无可导入内容，请先抓取。', 'warn'); return; }
      const btn = document.getElementById('done');
      btn.disabled = true;
      setStatus('正在导入 ' + grabbed.length + ' 项到精灵池…');
      try {
        const res = await window.syncAPI.import(grabbed);
        setStatus(`导入完成：${res.added.length} 项（本次新增 ${res.count}）。可关闭此窗口到精灵池查看。`, 'ok');
      } catch (err) {
        setStatus('导入失败：' + (err && err.message || err), 'error');
      } finally {
        btn.disabled = false;
      }
    };

    // 注入提取脚本（由主进程注入，避免页面 CSP 问题）
    window.addEventListener('DOMContentLoaded', () => {
      window.syncAPI.getScript().then((s) => { window.SEER_EXTRACT_SCRIPT = s; });
    });
  </script>
</body>
</html>
